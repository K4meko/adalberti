version: '3'

services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    working_dir: /home/node/app/
    environment:
      # Required for Next.js hot reload when the project folder is bind-mounted on Windows
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    command: >-
      sh -c "apk add --no-cache libc6-compat >/dev/null 2>&1;
      corepack enable && corepack prepare pnpm@10 --activate;
      if [ ! -f node_modules/.modules.yaml ]; then pnpm install; fi;
      pnpm dev"
    develop:
      watch:
        - action: sync+exec
          path: ./package.json
          target: /home/node/app/package.json
          exec:
            command: pnpm install
        - action: sync+exec
          path: ./pnpm-lock.yaml
          target: /home/node/app/pnpm-lock.yaml
          exec:
            command: pnpm install
    depends_on:
      - mongo
      # - postgres
    env_file:
      - .env

  # Ensure your DATABASE_URL uses 'mongo' as the hostname ie. mongodb://mongo/my-db-name
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

  # Uncomment the following to use postgres
  # postgres:
  #   restart: always
  #   image: postgres:latest
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  data:
  # pgdata:
  node_modules:
  pnpm_store:
